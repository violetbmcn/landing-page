<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
        }
        img {
            width: 100vw;
            display: block;
            margin-bottom: 8vh; 
        }
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 8vh;
            padding: 0 2vw;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-sizing: border-box;
        }
        .song-title {
            /* Scales font size relative to window width */
            font-size: 2.5vw;
            white-space: nowrap;
            text-transform: lowercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <img src="landingimage.jpg" alt="Landing Image">
    
    <div class="footer-bar">
        <span class="song-title">stuck in a car with angels - julie</span>
    </div>

    <audio id="bgMusic" autoplay loop>
        <source src="stuck in a car with angels [-GEjqO8J234].mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bgMusic');
        audio.volume = 0.2;

        window.addEventListener('click', () => {
            audio.play();
        }, { once: true });
    </script>

</body>
</html>
